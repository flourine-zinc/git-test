<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#222839"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="sword" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (safe for maskable) -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Gold ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#8b5cf6" stroke-width="16"/>

  <!-- Sword blade -->
  <path d="M256 96 L300 160 L276 184 L232 120 Z" fill="url(#sword)"/>
  <!-- Sword handle -->
  <rect x="244" y="300" width="24" height="96" rx="8" fill="#8b5cf6"/>
  <!-- Crossguard -->
  <rect x="210" y="288" width="92" height="20" rx="8" fill="#a78bfa"/>
  <!-- Pommel -->
  <circle cx="256" cy="416" r="18" fill="#f5c518"/>

  <!-- Checkmark sparkle -->
  <path d="M190 210 L220 240 L322 138" fill="none" stroke="#34d399" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>